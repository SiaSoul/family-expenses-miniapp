<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#222}
.card{max-width:520px;margin:0 auto;padding:22px;border-radius:18px;background:#f2f2f2}
h1{margin:0 0 12px;font-size:24px}.ok{margin:10px 0;font-size:17px;font-weight:600}.muted{color:#777;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Семейный бюджет</h1>
<div class="ok">✅ GitHub Pages Mini App загрузился</div>
<div id="telegramStatus" class="ok">Проверяю Telegram…</div>
<div id="details" class="muted"></div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  document.getElementById('telegramStatus').textContent =
    tg.initData ? '✅ Telegram Web App подключён' : 'ℹ️ Страница открыта вне Telegram';
  document.getElementById('details').textContent =
    'Платформа: ' + (tg.platform || 'не определена');
} else {
  document.getElementById('telegramStatus').textContent =
    'ℹ️ Telegram Web App не обнаружен';
}
</script>
</body>
</html>
